{
  "name": "Feature proposal",
  "description": "Propose a bounded change before implementation",
  "title": "[Feature proposal] ",
  "labels": [
    "type:feature",
    "level:feature",
    "status:proposed"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Do not post vulnerabilities, secrets, serials, private lab/customer data or vendor binaries. Use the private security-report link below for vulnerabilities. Proposed work is not implemented functionality."
      }
    },
    {
      "type": "dropdown",
      "id": "project",
      "attributes": {
        "label": "Project",
        "options": [
          "FireTabs Android",
          "Crestron Panel",
          "Shared repository"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "parent",
      "attributes": {
        "label": "Parent project/feature issue",
        "description": "Use an issue number/URL or say needs triage."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "problem",
      "attributes": {
        "label": "Problem and intended behavior"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "scope",
      "attributes": {
        "label": "Scope and non-goals"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "acceptance",
      "attributes": {
        "label": "Acceptance criteria",
        "description": "Observable evidence required; do not mark proposed behavior complete."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "sources",
      "attributes": {
        "label": "Existing work and evidence",
        "description": "Upstream code/commits and related issues; identify assumptions."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "resources",
      "attributes": {
        "label": "Dependencies, resources and device impact"
      },
      "validations": {
        "required": true
      }
    }
  ]
}
