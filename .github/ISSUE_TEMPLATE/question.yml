        "label": "Project",
        "options": [
          "ValethonOS for Android",
          "Crestron Panel",
          "Shared repository"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "question",
      "attributes": {
        "label": "Question and documentation already checked"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "context",
      "attributes": {
        "label": "Relevant version, component and context"
      },
      "validations": {
        "required": false
      }
    }
  ]
