name: Project validation
on:
  pull_request:
  push:
    branches: [development, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    name: Repository integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate syntax and change integrity
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$PUSH_BASE"
          if [ "$EVENT" = pull_request ]; then base="$PR_BASE"; fi
          if [ -n "$base" ] && [ "$base" != 0000000000000000000000000000000000000000 ]; then
            python3 scripts/ci.py repository --base "$base"
          else
            python3 scripts/ci.py repository
          fi
      - name: Validate community docs and release records
        run: python3 scripts/check_community.py
      - name: Verify maintained-kernel audit evidence
        run: python3 scripts/kernel_audit.py
      - name: Verify DT source inputs and patches
        run: python3 scripts/build_douglas_dtb.py --verify-only
      - name: Check retained resolved diagnostic kernel policy
        run: python3 scripts/diagnostic_config.py check evidence/diagnostic-kernel/diagnostic.config
      - name: Verify bounded clock and pinctrl reference audits
        run: |
          python3 scripts/audit_clock_references.py --check
          python3 scripts/audit_pinctrl_references.py --check
          python3 scripts/audit_power_references.py --check
      - name: Test gate rejection paths
        run: python3 -m unittest discover -s tests -v
      - name: Verify pinned genpd wakeup source comparison
        run: python3 scripts/validate_genpd_wakeup_comparison.py
  android:
    name: FireTabs Android evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 scripts/ci.py firetabs-android
      - name: Compile isolated diagnostic userspace (no firmware packing)
        run: python3 scripts/build_diagnostic_initramfs.py
      - name: Build pinned isolated device-tree compiler
        run: python3 scripts/setup_dtb_tools.py --download
      - name: Compile and inspect experimental douglas DTB
        run: python3 scripts/build_douglas_dtb.py
      - name: Compile PMIC node-name candidate and compare all DT properties
        run: |
          python3 scripts/build_douglas_dtb.py --experiment pmic-node-names
          python3 scripts/compare_pmic_dtb.py
      - name: Compile sysirq node-name candidate and compare all DT properties
        run: |
          python3 scripts/build_douglas_dtb.py --experiment sysirq-node-name
          python3 scripts/compare_pmic_dtb.py --experiment sysirq-node-name
      - name: Compile display RDMA node-name candidate and verify narrow alias rewrite
        run: |
          python3 scripts/build_douglas_dtb.py --experiment rdma-node-name
          python3 scripts/compare_pmic_dtb.py --experiment rdma-node-name
      - name: Compile PMIC parent-name candidate and verify all properties/phandles
        run: |
          python3 scripts/build_douglas_dtb.py --experiment pwrap-pmic-node-name
          python3 scripts/compare_pmic_dtb.py --experiment pwrap-pmic-node-name
          python3 scripts/validate_power_provider_tree.py --dtb work/dtb-compile/pwrap-pmic-node-name/douglas.dtb
          python3 scripts/validate_pinctrl_syscfg.py --dtb work/dtb-compile/pwrap-pmic-node-name/douglas.dtb
          python3 scripts/validate_iommu_dependencies.py --dtb work/dtb-compile/pwrap-pmic-node-name/douglas.dtb
          python3 scripts/audit_usb_prerequisites.py --dtb work/dtb-compile/pwrap-pmic-node-name/douglas.dtb
          python3 scripts/validate_usb_variant_definition.py
      - name: Compile isolated disabled USB resource experiment and verify complete delta
        run: |
          python3 scripts/build_douglas_dtb.py --experiment usb-frequency-resource
          python3 scripts/compare_usb_resource_dtb.py
      - name: Verify finite USB0 analog, role and clock source comparison
        run: python3 scripts/audit_usb0_transitions.py
  panel:
    name: Crestron Panel evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 scripts/ci.py crestron-panel
