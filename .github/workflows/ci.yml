name: Project validation
on:
  pull_request:
  push:
    branches: [development, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    name: Repository integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate syntax and change integrity
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$PUSH_BASE"
          if [ "$EVENT" = pull_request ]; then base="$PR_BASE"; fi
          if [ -n "$base" ] && [ "$base" != 0000000000000000000000000000000000000000 ]; then
            python3 scripts/ci.py repository --base "$base"
          else
            python3 scripts/ci.py repository
          fi
      - name: Validate community docs and release records
        run: python3 scripts/check_community.py
      - name: Verify maintained-kernel audit evidence
        run: python3 scripts/kernel_audit.py
      - name: Verify DT source inputs and patches
        run: python3 scripts/build_douglas_dtb.py --verify-only
      - name: Verify bounded clock and pinctrl reference audits
        run: |
          python3 scripts/audit_clock_references.py --check
          python3 scripts/audit_pinctrl_references.py --check
      - name: Test gate rejection paths
        run: python3 -m unittest discover -s tests -v
  android:
    name: FireTabs Android evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 scripts/ci.py firetabs-android
      - name: Build pinned isolated device-tree compiler
        run: python3 scripts/setup_dtb_tools.py --download
      - name: Compile and inspect experimental douglas DTB
        run: python3 scripts/build_douglas_dtb.py
      - name: Compile PMIC node-name candidate and compare all DT properties
        run: |
          python3 scripts/build_douglas_dtb.py --experiment pmic-node-names
          python3 scripts/compare_pmic_dtb.py
  panel:
    name: Crestron Panel evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 scripts/ci.py crestron-panel
