name: Standalone stage1 ARM ELF link probe
on:
  workflow_dispatch:
  pull_request:
    branches: [development]
    paths:
      - diagnostic/logging/**
      - diagnostic/protocol/**
      - scripts/build_owned_agent_probe.py
      - diagnostic/entry/**
      - scripts/build_owned_entry_probe.py
      - scripts/decode_diagnostic_marker.py
      - tests/test_decode_diagnostic_marker.py
      - scripts/build_stage1_link_probe.py
      - scripts/inspect_stage1_elf.py
      - scripts/inspect_stage1_relocations.py
      - tests/test_inspect_stage1_relocations.py
      - scripts/prepare_stage1_host_image.py
      - tests/test_prepare_stage1_host_image.py
      - tests/test_inspect_stage1_elf.py
      - .github/workflows/stage1-link-probe.yml
permissions:
  contents: read
concurrency:
  group: stage1-link-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  link:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Compile and link with preinstalled tools only
        run: python3 scripts/build_stage1_link_probe.py
      - name: Compile and link owned diagnostic entry without execution
        run: python3 scripts/build_owned_entry_probe.py
      - name: Compile and link owned callable agent without execution
        run: python3 scripts/build_owned_agent_probe.py
