name: MT8163 provider compile experiment
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Compile integration scope
        type: choice
        options: [clocks, clocks-pinctrl, providers, usb-providers, usb-acm-diagnostic, sym827-provider, mipi-provider, dsi-provider, pwm-provider, diagnostic]
        default: diagnostic
      argument_profile:
        description: Generic-only forced argument selection (diagnostic mode)
        type: choice
        options: [none, generic-force]
        default: none
      emulated_boot:
        description: Run bounded generic ARM64 virt userspace test (diagnostic mode only)
        type: boolean
        default: false
  pull_request:
    types: [opened, ready_for_review]
    paths:
      - projects/firetabs-android/kernel/clock-port/**
      - projects/firetabs-android/kernel/regulator-port/**
      - projects/firetabs-android/kernel/pwm-port/**
      - scripts/apply_pwm_port.py
      - scripts/build_pwm_provider.sh
      - projects/firetabs-android/kernel/dsi-port/**
      - scripts/apply_dsi_port.py
      - scripts/build_dsi_provider.sh
      - projects/firetabs-android/kernel/mipi-port/**
      - scripts/apply_mipi_port.py
      - scripts/build_mipi_provider.sh
      - scripts/apply_sym827_port.py
      - scripts/build_sym827_provider.sh
      - scripts/apply_clock_port.py
      - projects/firetabs-android/kernel/iommu-port/**
      - scripts/apply_iommu_port.py
      - projects/firetabs-android/kernel/usb-port/**
      - projects/firetabs-android/kernel/usb-acm/fragment.config
      - projects/firetabs-android/kernel/usb-acm/profile.json
      - scripts/usb_acm_config.py
      - scripts/apply_usb_port.py
      - scripts/select_kernel_build_scope.py
      - scripts/build_ack_baseline.sh
      - scripts/diagnostic_config.py
      - scripts/check_diagnostic_commandline.py
      - scripts/run_qemu_diagnostic.py
      - scripts/install_qemu_for_ci.py
      - scripts/build_diagnostic_initramfs.py
      - projects/firetabs-android/diagnostic/**
      - projects/firetabs-android/kernel/diagnostic/**
      - .github/workflows/kernel-baseline.yml
permissions:
  contents: read
concurrency:
  group: clock-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select explicit kernel build scope
        id: scope
        env:
          BUILD_EVENT: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode || 'diagnostic' }}
          REQUESTED_ARGUMENTS: ${{ inputs.argument_profile || 'none' }}
          REQUESTED_QEMU: ${{ inputs.emulated_boot || 'false' }}
        run: python3 scripts/select_kernel_build_scope.py --event "$BUILD_EVENT" --mode "$REQUESTED_MODE" --argument-profile "$REQUESTED_ARGUMENTS" --emulated-boot "$REQUESTED_QEMU" --github-output "$GITHUB_OUTPUT"
      - name: Install kernel host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dwarves libelf-dev libssl-dev
          dpkg-query -W dwarves libelf-dev libssl-dev clang-18 lld-18
      - name: Gate and install generic ARM64 VM dependencies
        if: steps.scope.outputs.qemu == 'true'
        run: python3 scripts/install_qemu_for_ci.py --install
      - name: Preflight and compile generic ARM64 baseline
        env:
          BUILD_MODE: ${{ steps.scope.outputs.mode }}
          ARGUMENT_PROFILE: ${{ steps.scope.outputs.argument_profile }}
        run: |
          if [ "$BUILD_MODE" = pwm-provider ]; then
            bash scripts/build_pwm_provider.sh
          elif [ "$BUILD_MODE" = dsi-provider ]; then
            bash scripts/build_dsi_provider.sh
          elif [ "$BUILD_MODE" = mipi-provider ]; then
            bash scripts/build_mipi_provider.sh
          elif [ "$BUILD_MODE" = sym827-provider ]; then
            bash scripts/build_sym827_provider.sh
          else
            bash scripts/build_ack_baseline.sh "$BUILD_MODE"
          fi

      - name: Generic QEMU virt diagnostic userspace smoke test
        if: steps.scope.outputs.qemu == 'true'
        env:
          ARGUMENT_PROFILE: ${{ steps.scope.outputs.argument_profile }}
        run: |
          python3 scripts/build_diagnostic_initramfs.py
          force_option=()
          if [ "$ARGUMENT_PROFILE" = generic-force ]; then force_option=(--force-argument-test); fi
          python3 scripts/run_qemu_diagnostic.py --kernel work/ack-baseline/output/arch/arm64/boot/Image --config work/ack-baseline/output/.config --initramfs out/diagnostic-initramfs/initramfs.cpio.gz --output out/qemu-diagnostic "${force_option[@]}"
