name: MT8163 PMIC and power object compile
on:
  workflow_dispatch:
  pull_request:
    types: [opened, ready_for_review]
    paths:
      - projects/firetabs-android/kernel/power-port/**
      - scripts/apply_power_port.py
      - scripts/build_power_probe.sh
      - .github/workflows/power-probe.yml
permissions:
  contents: read
concurrency:
  group: power-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install kernel host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dwarves libelf-dev libssl-dev
          dpkg-query -W dwarves libelf-dev libssl-dev clang-18 lld-18
      - name: Preflight and compile generic ARM64 baseline
        run: bash scripts/build_power_probe.sh
